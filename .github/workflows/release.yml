name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check version consistency
        run: npm run version:check

      - name: Check tag matches package version
        id: version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg_version" >&2
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Build and create release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "WinCleaner ${{ github.ref_name }}"
          releaseBody: |
            See the `[${{ steps.version.outputs.version }}]` section of
            [CHANGELOG.md](https://github.com/CaseReed/wincleaner/blob/main/CHANGELOG.md)
            for release notes.

            Installers are unsigned until SignPath signing is configured in the
            repository secrets — see `docs/code-signing.md`.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      # --- SignPath signing skeleton (free for OSS) --------------------------
      #
      # This job only runs when the four SignPath secrets are set in the
      # repository settings (Settings > Secrets and variables > Actions). While
      # they are missing, this step is simply skipped and the release published
      # by tauri-action above stays unsigned — see `docs/code-signing.md` for
      # the SignPath OSS programme sign-up procedure and the details of the
      # four secrets to set:
      #   SIGNPATH_API_TOKEN, SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
      #   SIGNPATH_SIGNING_POLICY_SLUG.
      #
      # Inputs checked on 2026-09-10 in the action.yml of
      # signpath/github-action-submit-signing-request (main branch):
      # api-token, organization-id, project-slug, signing-policy-slug,
      # github-artifact-id (required); artifact-configuration-slug, parameters,
      # output-artifact-directory (optional); wait-for-completion (bool,
      # default true). Useful output: signed-artifact-download-url.
      - name: Check SignPath secrets
        id: signpath-check
        shell: bash
        run: |
          if [ -n "${{ secrets.SIGNPATH_API_TOKEN }}" ] && \
             [ -n "${{ secrets.SIGNPATH_ORGANIZATION_ID }}" ] && \
             [ -n "${{ secrets.SIGNPATH_PROJECT_SLUG }}" ] && \
             [ -n "${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload installers as build artifact (for signing)
        if: steps.signpath-check.outputs.configured == 'true'
        id: upload-for-signing
        uses: actions/upload-artifact@v4
        with:
          name: wincleaner-unsigned-installers
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error

      - name: Submit SignPath signing request
        if: steps.signpath-check.outputs.configured == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-for-signing.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installers

      # TODO (once signed up with SignPath): upload the contents of
      # `signed-installers/` to the release created by tauri-action above (for
      # example with `gh release upload` or softprops/action-gh-release), once
      # the first signing attempt has been validated on a real SignPath
      # project.
