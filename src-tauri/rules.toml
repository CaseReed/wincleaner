[[rule]]
id = "windows.temp"
category = "System"
label = "Temporary files"
paths = ["%TEMP%\\**\\*"]
exclude = []
risk = "low"

[[rule]]
id = "windows.recycle-bin"
category = "System"
label = "Recycle Bin"
kind = "recycle-bin"
paths = []
exclude = []
risk = "low"
default_checked = false

[[rule]]
id = "windows.thumbnails"
category = "System"
label = "Thumbnail cache"
paths = [
  "%LOCALAPPDATA%\\Microsoft\\Windows\\Explorer\\thumbcache_*.db",
  "%LOCALAPPDATA%\\Microsoft\\Windows\\Explorer\\iconcache_*.db",
]
exclude = []
risk = "low"

# `Recent\**\*` used to descend into CustomDestinations, which holds the items
# the user explicitly pinned by right-clicking the taskbar. Those are not junk:
# they are hand-curated data. The `*.lnk` pattern is not recursive
# (literal_separator), so it does not descend.
[[rule]]
id = "windows.explorer-recent"
category = "System"
label = "Recent items"
paths = [
  "%APPDATA%\\Microsoft\\Windows\\Recent\\*.lnk",
  "%APPDATA%\\Microsoft\\Windows\\Recent\\AutomaticDestinations\\*",
]
exclude = []
risk = "medium"
default_checked = false

# Formerly "windows.user-logs", which also listed `%LOCALAPPDATA%\Temp\*.log` —
# a strict subset of windows.temp on a standard installation, hence bytes
# counted twice and bogus "Skipped" entries in the report. Medium risk: a crash
# dump is exactly what a user in the middle of diagnosing a crash does not want
# to see disappear with no way back.
[[rule]]
id = "windows.crash-dumps"
category = "System"
label = "Crash dumps"
paths = ["%LOCALAPPDATA%\\CrashDumps\\*"]
exclude = []
risk = "medium"
default_checked = false

# `Service Worker\Database` is deliberately absent: it holds the service worker
# registrations, not their cache — clearing it breaks offline mode for
# installed web apps. Same reason for not touching `Local Storage`,
# `IndexedDB`, `Session Storage`: application data.
[[rule]]
id = "edge.cache"
category = "Browsers"
label = "Microsoft Edge cache"
paths = [
  "%LOCALAPPDATA%\\Microsoft\\Edge\\User Data\\*\\Cache\\**\\*",
  "%LOCALAPPDATA%\\Microsoft\\Edge\\User Data\\*\\Code Cache\\**\\*",
  "%LOCALAPPDATA%\\Microsoft\\Edge\\User Data\\*\\GPUCache\\**\\*",
  "%LOCALAPPDATA%\\Microsoft\\Edge\\User Data\\*\\DawnGraphiteCache\\**\\*",
  "%LOCALAPPDATA%\\Microsoft\\Edge\\User Data\\*\\DawnWebGPUCache\\**\\*",
  "%LOCALAPPDATA%\\Microsoft\\Edge\\User Data\\*\\Service Worker\\CacheStorage\\**\\*",
  "%LOCALAPPDATA%\\Microsoft\\Edge\\User Data\\*\\Service Worker\\ScriptCache\\**\\*",
  "%LOCALAPPDATA%\\Microsoft\\Edge\\User Data\\ShaderCache\\**\\*",
]
exclude = []
risk = "low"

[[rule]]
id = "chrome.cache"
category = "Browsers"
label = "Google Chrome cache"
paths = [
  "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\*\\Cache\\**\\*",
  "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\*\\Code Cache\\**\\*",
  "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\*\\GPUCache\\**\\*",
  "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\*\\DawnGraphiteCache\\**\\*",
  "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\*\\DawnWebGPUCache\\**\\*",
  "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\*\\Service Worker\\CacheStorage\\**\\*",
  "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\*\\Service Worker\\ScriptCache\\**\\*",
  "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\ShaderCache\\**\\*",
]
exclude = []
risk = "low"

[[rule]]
id = "firefox.cache"
category = "Browsers"
label = "Mozilla Firefox cache"
paths = [
  "%LOCALAPPDATA%\\Mozilla\\Firefox\\Profiles\\*\\cache2\\**\\*",
  "%LOCALAPPDATA%\\Mozilla\\Firefox\\Profiles\\*\\startupCache\\**\\*",
]
exclude = []
risk = "low"

# Package-manager cache Winapp2 does not cover. Re-downloadable by design:
# npm refills it on the next install, hence risk "low". Same category as the
# converted Winapp2 rules — it is an application cache like the rest.
# (pip's cache is NOT added here: Winapp2's `[Python *]` section already
# covers `%LOCALAPPDATA%\Pip\cache` via `winapp2.python` — see rules.rs's
# `no_native_rule_overlaps_a_converted_winapp2_rule` test.)
[[rule]]
id = "npm.cache"
category = "Applications"
label = "npm cache"
paths = ["%LOCALAPPDATA%\\npm-cache\\**\\*"]
exclude = []
risk = "low"
